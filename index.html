const linked=list('work').filter(w=>r.type==='assets'?w.asset===key:r.type==='locations'?siteOf(w)===key:r.type==='people'?w.person===key:r.type==='vendors'?w.vendor===key:r.type==='work'?w.parent===key:false);if(linked.length)body+=`<details open><summary>${r.type==='work'?'Project tasks':'Linked work'} (${linked.length})</summary>${linked.map(card).join('')}</details>`;
if(r.type==='work'){body+=`<p>${esc(r.notes||'No findings yet.')}</p><div class="help">Due ${esc(r.due||'not set')} · ${esc(name(r.vendor)||r.owner||'Unassigned')}<br>Estimate ${money(r.estimate)} · Actual ${money(r.cost)}<br>Approval ${esc(r.approval||'Not requested')} · ${esc(r.approvedBy||'')}</div><div class="row">${r.asset?btn('Open asset','open',r.asset):''}${r.parent?btn('Parent project','open',r.parent):''}${r.nextWorkId?btn('Next service','open',r.nextWorkId):''}</div>`;const qs=list('quotes').filter(q=>q.work===key);if(qs.length)body+=`<details open><summary>Quote comparison</summary><div class="table"><table><thead><tr><th>Vendor / price</th><th>Scope / lead</th><th>Terms / warranty</th><th>Risk / recommendation</th></tr></thead><tbody>${qs.map(q=>`<tr><td>${esc(name(q.vendor))}<br>${money(q.amount)}<br>${btn('Open','open',q.id)}</td><td>${esc(q.specs)}<br>${esc(q.lead)}</td><td>${esc(q.terms)}<br>${esc(q.warranty)}</td><td>${esc(q.risk)}<br>${esc(q.recommendation)}</td></tr>`).join('')}</tbody></table></div></details>`;}
if(r.type==='people')body+=`<details open><summary>Test and shift records</summary>${S.records.filter(x=>['tests','hos'].includes(x.type)&&x.person===key).map(card).join('')||'<p>No entries.</p>'}</details>`;
const docs=list('documents').filter(d=>d.asset===key||d.person===key||d.location===key||d.vendor===key);if(docs.length)body+=`<details><summary>Linked documents</summary>${docs.map(card).join('')}</details>`;
const activeDetails=r.type==='assets'?normalizeAsset(r):r;body+=`<details><summary>Retained details</summary>${Object.entries(activeDetails).filter(([k,v])=>!['id','name','type','history','attachments','meterHistory'].includes(k)&&v!==''&&v!=null&&typeof v!=='object').map(([k,v])=>`<p><small>${esc(k)}</small><br>${esc(v)}</p>`).join('')}${r.url&&validURL(r.url)?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open document</a>`:''}</details><details><summary>Attachments (${(r.attachments||[]).length})</summary>${(r.attachments||[]).map((f,i)=>`<p>${esc(f.name)} ${btn('Download','download',key+':'+i)}</p>`).join('')||'<p>No files.</p>'}</details><details><summary>History</summary>${(r.history||[]).slice().reverse().map(h=>`<div class="history">${esc(new Date(h.at).toLocaleString())}<br>${esc(h.text)}${h.details?'<pre style="white-space:pre-wrap">'+esc(JSON.stringify(h.details,null,2))+'</pre>':''}</div>`).join('')||'<p>No changes recorded.</p>'}<small>Editable local history, not an immutable audit trail.</small></details>`;modal(body);}
function reports(){if(['budgets','expenses','fuel'].includes(tab)){const rows=list(tab).filter(matches);$('view').innerHTML=(tab==='fuel'?'<div class="help">Fuel/IFTA worksheet only. Dates identify year/quarter. No tax calculation, filing or automatic reconciliation. Do not duplicate trip mileage across receipts.</div>':'')+rows.map(r=>card(r)+(tab==='budgets'?`<div class="help">Recorded actual: ${money(budgetActual(r))} · Remaining: ${money(Number(r.amount||0)-budgetActual(r))}</div>`:'')).join('')+(rows.length?'':'<div class="empty">No entries.</div>');return;}
if(tab==='settings'){$('view').innerHTML=`<div class="card"><h2>Carrier profile</h2><p>${esc(S.profile.type)}<br>International operations: ${esc(S.profile.international)}<br>USDOT: ${esc(S.profile.dot||'Not entered')} · MC: ${esc(S.profile.mc||'Optional / not entered')}</p><div class="help">Private own-goods interstate operations. Applicable safety, IFTA/registration, CDL/testing and HOS requirements require independent review. No international/customs workflow.</div>${btn('Edit profile','profile')}</div><div class="card"><h2>Data controls</h2><div class="row">${btn('Export backup','export')}${btn('Restore version-5 backup','import')}${btn('Reset demo','reset')}</div><details><summary>Scope and limitations</summary><p>No Firebase, user permissions, immutable audit trail, external reminders, ELD integration, tax filing or approval enforcement. Browser-only demo. No older-version automatic migration. Do not enter actual employee/confidential information. Exports include embedded attachments; keep them private.</p></details></div>`;return;}
const year=String(new Date().getFullYear()),rows=costs().filter(r=>(!site||r.location===site)&&String(r.date||'').startsWith(year));$('view').innerHTML=`<div class="metrics"><div class="card"><small>Recorded cost · ${year}</small><div class="stat">${money(rows.reduce((s,r)=>s+r.amount,0))}</div></div><div class="card"><small>Open work</small><div class="stat">${list('work').filter(matches).filter(w=>w.status!=='Completed').length}</div></div><div class="card"><small>Facilities / systems</small><div class="stat">${list('assets').filter(matches).filter(a=>['building','system'].includes(a.assetType)).length}</div></div></div><div class="card"><h2>Recorded costs by category</h2>${COSTCATS.map(c=>`<p>${c}: ${money(rows.filter(r=>r.category===c).reduce((s,r)=>s+r.amount,0))}</p>`).join('')}<small>Work actuals + separate expenses + fuel. Do not duplicate invoices or child-task costs on parent projects. Open project estimates may overlap child estimates; no automatic consolidation.</small></div><div class="card"><h2>Budgets</h2>${list('budgets').filter(matches).map(b=>`<p>${esc(b.name)} · ${esc(b.year)} · Budget ${money(b.amount)} · Actual ${money(budgetActual(b))} ${btn('Open','open',b.id)}</p>`).join('')||'No budgets.'}</div>`;}
function menu(title,items){modal(`<h2>${title}</h2><div class="grid">${items.map(([l,t])=>btn(l,'new',t)).join('')}</div><p style="margin-top:18px">${btn('Cancel','close')}</p>`);}
function exportData(){downloadData(JSON.stringify({format:'dwyer-typed-workflow-v5',exportedAt:new Date().toISOString(),state:S},null,2),'dwyer-workflow-v5-backup.json','application/json');}
function importData(){modal(`<h2>Restore version-5 demo backup</h2><p>Replaces current records. Export first. Only restore your own trusted files.</p><input type="file" id="importFile" accept="application/json"><p>${btn('Close','close')}</p>`);$('importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>6*1024*1024)throw Error('Backup exceeds 6 MB.');const b=JSON.parse(await f.text());if(b.format!=='dwyer-typed-workflow-v5'||b.state?.version!==5||!Array.isArray(b.state.records)||!b.state.profile)throw Error('Only version-5 backups are supported.');const seen=new Set();for(const r of b.state.records){if(typeof r.id!=='string'||!/^[\w-]+$/.test(r.id)||seen.has(r.id)||typeof r.name!=='string'||!(schemas[r.type]||r.type==='assets'))throw Error('Invalid record.');seen.add(r.id);if(r.type==='assets'){if(!TYPE[r.assetType])throw Error('Invalid asset type.');const clean=normalizeAsset(r);if(Object.keys(r).some(k=>!(k in clean)))throw Error('Asset has incompatible active fields.');}if(r.attachments&&(!Array.isArray(r.attachments)||r.attachments.length>5))throw Error('Invalid attachments.');for(const a of r.attachments||[])if(typeof a.data!=='string'||a.data.length>420000||!/^data:(image\/[\w.+-]+|application\/pdf);base64,/.test(a.data))throw Error('Invalid attachment format.');}if(confirm('Replace this demo with the backup?')&&commit(b.state)){close(true);render();}}catch(e){error(e.message);}};}
function profile(){modal(`<h2>Carrier profile</h2><form id="form">${field(['dot','USDOT number'],S.profile.dot)}${field(['mc','MC authority (optional)'],S.profile.mc)}${field(['notes','Notes','textarea'],S.profile.notes)}${footer()}</form>`,d=>{const n=clone();n.profile={...n.profile,...d};if(commit(n)){close(true);render();}});}
function action(a,key){if(['noop','draftDownload','draftRemove'].includes(a))return;if(a==='close')return close();if(busy)return error('Wait for attachment processing.');if($('modal').open&&dirty&&!confirm('Discard unsaved edits?'))return;switch(a){case'tab':tab=key;query='';render();break;case'new':editor(key,'',{location:site});break;case'open':openRecord(key);break;case'edit':editor(rec(key).type,key);break;case'issue':{const r=rec(key);editor('work','',{asset:r?.type==='assets'?key:'',location:r?.type==='locations'?key:siteOf(r)||site,category:'Repair',due:day()});break;}case'schedule':{const r=rec(key);editor('work','',{asset:r?.type==='assets'?key:'',location:r?.type==='locations'?key:siteOf(r)||site,category:'Preventive maintenance',status:'Scheduled',due:day(7)});break;}case'safety':editor('work','',{category:'Safety / corrective action',location:site,due:day()});break;case'childAsset':{const r=rec(key);assetForm('',{assetType:'system',location:r.type==='locations'?key:r.location,parentAsset:r.type==='assets'?key:''});break;}case'task':editor('work','',{parent:key,asset:rec(key)?.asset,location:siteOf(rec(key)),category:'Project task'});break;case'quote':editor('quotes','',{work:key});break;case'doc':{const r=rec(key);editor('documents','',{location:siteOf(r),asset:r.type==='assets'?key:'',person:r.type==='people'?key:''});break;}case'test':editor('tests','',{person:key,name:'Test · '+name(key)});break;case'hos':editor('hos','',{person:key,location:siteOf(rec(key)),name:'Shift review · '+name(key)});break;case'training':editor('work','',{person:key,location:siteOf(rec(key)),category:'Training'});break;case'fuel':editor('fuel','',{asset:key});break;case'addAssets':menu('Add location or asset',[['Location / branch','locations'],['Building, system, vehicle or equipment','assets'],['Document / certificate','documents']]);break;case'addPeople':menu('Add people or partner record',[['Person / driver','people'],['Vendor / contractor','vendors'],['Test log','tests'],['Shift review','hos']]);break;case'addReports':menu('Add financial record',[['Expense / utility bill','expenses'],['Annual budget','budgets'],['Fuel / mileage','fuel'],['Quotation','quotes']]);break;case'profile':profile();break;case'export':exportData();break;case'import':importData();break;case'reset':if(confirm('Discard edits and restore fictional sample records?')&&commit(seed())){close(true);render();}break;case'download':{const [id,i]=key.split(':');const f=rec(id)?.attachments?.[Number(i)];if(f)downloadFile(f);break;}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b.dataset.id||'');});$('nav').onchange=e=>jump(e.target.value);$('modal').addEventListener('cancel',e=>{e.preventDefault();close();});window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue='';}});render();if(warning)notice(warning,true);
</script></body></html>
