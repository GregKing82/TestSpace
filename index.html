<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dwyer · Fleet & Facilities</title><style>
[hidden]{display:none!important}
:root{--taupe:#bca897;--bg:#f8f6f2;--ink:#433e39;--muted:#786d63;--line:#e1d8ce;--accent:#78614e;--red:#97453e;--amber:#8a5a12;--green:#356148}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:var(--taupe);color:#fff;padding:14px max(16px,calc((100vw - 1140px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.brand{font:30px Georgia,serif;letter-spacing:-1.5px;line-height:1}.sub{font-size:10px;letter-spacing:1.5px;margin-top:4px}
header select{width:190px;background:transparent;color:#fff;border:1px solid #fff;border-radius:24px;min-height:42px;padding:8px 14px}
option,optgroup{color:var(--ink);background:#fff}
.demo{text-align:center;padding:6px 12px;font-size:11px;background:#eee6dd;color:#6b594b}
main{max-width:1172px;margin:auto;padding:20px 16px 70px}
h1{font:28px Georgia,serif;margin:0}h2{font:23px Georgia,serif;margin:0}h3{font-size:15px;margin:0 0 4px}
p{margin:6px 0 12px}small,.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}
.toolbar{margin-bottom:14px}
.btn{border:1px solid #c7b7a9;border-radius:24px;padding:8px 15px;min-height:42px;background:#fff;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:2px 0;min-height:0;text-decoration:underline;white-space:normal;text-align:left}
.btn.danger{color:var(--red)}
.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:15px;margin-bottom:10px}
.card.overdue{border-left:4px solid var(--red)}.card.soon{border-left:4px solid #c99a4a}.card.missing{border-left:4px solid var(--red)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}.grid .card{margin:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}
.pill{display:inline-block;background:#eee8e0;font-size:11px;padding:3px 9px;border-radius:14px;vertical-align:1px;white-space:nowrap}
.pill.red{background:#f9e7e3;color:var(--red)}.pill.amber{background:#f7ecd9;color:var(--amber)}.pill.green{background:#e8f0e6;color:var(--green)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.chip{border:1px solid #d1c6ba;background:#fff;border-radius:18px;padding:6px 12px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{max-width:360px;margin-bottom:10px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 18px}
.metric{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;text-align:left;color:var(--ink)}
.metric.on{outline:2px solid var(--accent)}
.metric small{display:block;font-size:11px}.stat{font:27px Georgia,serif}
.sect{font:19px Georgia,serif;margin:20px 0 10px}
input,select,textarea{width:100%;min-height:44px;padding:9px 10px;border:1px solid #d1c6ba;border-radius:7px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--accent);margin:0}
input[readonly]{background:#f3eee7}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;margin:10px 0 4px;color:#5d534a}
label .req{color:var(--red)}
.check{display:flex;align-items:center;gap:9px;font-size:14px;margin:12px 0;color:var(--ink)}
.help{padding:10px 12px;border-radius:7px;background:#f3eee7;margin:12px 0;font-size:12.5px}
.warn{padding:10px 12px;border-radius:7px;background:#f9e7e3;color:var(--red);margin:12px 0;font-size:13px}
.empty{padding:26px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:10px}
dialog{width:min(820px,96vw);max-height:94vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0;color:var(--ink);background:#fff}
dialog::backdrop{background:#272019a6}
.mhead{position:sticky;top:0;background:#fff;z-index:2;padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mbody{padding:6px 20px 20px}
.foot{position:sticky;bottom:0;background:#fff;padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.form-error{padding:10px;background:#fae8e4;color:var(--red);margin:12px 0 0;border-radius:7px}
.panel{border:1px solid var(--line);border-radius:10px;margin:14px 0;overflow:hidden}
.panel h3{margin:0;padding:10px 14px;background:#f6f1eb;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 16px;margin:10px 0}
.kv div small{display:block;font-size:11px}
.history{font-size:12px;border-left:2px solid var(--line);padding-left:10px;margin:8px 0}
details{margin:12px 0 0}summary{cursor:pointer;color:var(--accent);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
td.n,th.n{text-align:right}
.table{overflow:auto}
#notice{max-width:1140px;margin:10px auto 0;padding:10px 14px;background:#edf3e9;border-radius:8px}
#notice.error{background:#fae8e4;color:var(--red)}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:12px 0}
.typebtn{text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;color:var(--ink)}
.typebtn:hover{border-color:var(--accent)}.typebtn b{display:block}.typebtn small{font-size:12px}
a{color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #b78d69;outline-offset:2px}
@media(max-width:640px){header{padding:11px 14px}.brand{font-size:25px}.sub{font-size:9px}header select{width:160px}
.cols{grid-template-columns:1fr}main{padding:16px 12px 70px}.card{padding:13px}.metrics{grid-template-columns:repeat(2,1fr)}
.item,.prow{flex-direction:column;align-items:stretch}.item .acts,.prow .acts{justify-content:stretch}.item .acts .btn,.prow .acts .btn{flex:1}
h1{font-size:25px}.grid{grid-template-columns:1fr}dialog{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;border-radius:0;margin:0}.mhead,.mbody,.foot{padding-left:14px;padding-right:14px}}

/* ---------- requirements */

/* ---------- preventive maintenance */
function pmInfo(a) {

    const every = Number(a.pmEvery || T.pm.every), unit = METER[T.meter].unit;

    const nextAt = Number(last.meter) + every, left = nextAt - Number(a.meter || 0);
    const st = left <= 0 ? 'overdue' : left <= every * 0.1 ? 'soon' : 'ok';
    return { st, nextAt, left, label: `PM service (every ${num(every)} ${unit})`, text: left <= 0 ? `Overdue by ${num(-left)} ${unit} · was due at ${num(nextAt)} ${unit}` : `Due at ${num(nextAt)} ${unit} · ${num(left)} ${unit} to go` + (last.date ? ` · last done ${fmt(last.date)}` : '') };
  }

  const next = addMonths(last.date, months); return { st: state(next), next, label: lbl, text: dueText(next) + ` · last done ${fmt(last.date)}` };
}

/* ---------- the action list (Today) */
function actionItems() {
  const out = [];
  const push = o => out.push(o);
  const reqItems = (col, r, where) => { for (const k of reqKeys(col, r)) { const d = (r.due || {})[k] || {}; const st = state(d.next); if (st !== 'ok') push({ st, date: d.next || '0000', col, id: r.id, title: `${title(col, r)} — ${REQ[k].label}`, detail: (where ? where + ' · ' : '') + dueText(d.next), act: REQ[k].act, a: 'req', data: { col, id: r.id, k } }); } };

    const p = pmInfo(a); if (p && p.st !== 'ok') push({ st: p.st, date: p.next || (p.st === 'overdue' ? '0001' : '9998'), col: 'assets', id: a.id, title: `${a.unit} — ${p.label}`, detail: ASSET_TYPES[a.type].name + ' · ' + p.text, act: 'Record PM service', a: 'pm', data: { id: a.id } });
  });
  S.bitems.forEach(i => { const b = get('buildings', i.building); reqItems('bitems', i, `${b ? b.name : ''} · ${BCATS[BITEMS[i.kind].cat]}`); });

    const late = w.due && w.due < today(); const tgt = targetOf(w);
    const oos = tgt.t === 'asset' && tgt.rec && tgt.rec.status === 'Out of service' && w.oos;
