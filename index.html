<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dwyer · Operations Demo</title><style>
:root{--taupe:#bda998;--ink:#433e39;--muted:#776d64;--line:#e5ded7;--paper:#f8f6f2;--accent:#786352;--red:#9c443b;--green:#396348}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}header{background:var(--taupe);color:#fff;padding:16px max(18px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}.wordmark{font:33px Georgia,serif;letter-spacing:-2px}.sub{font-size:11px;letter-spacing:1px}header select{background:transparent;color:white;border:1px solid #fff;border-radius:22px;padding:9px 15px;min-width:160px}option{color:var(--ink);background:white}.demo{padding:7px 18px;text-align:center;font-size:11px;background:#eee7df;color:#6b5b4e}main{max-width:1156px;padding:24px 18px 70px;margin:auto}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}h1{font:32px Georgia,serif;margin:0}h2{font:23px Georgia,serif;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{margin:6px 0 14px}.muted,small{color:var(--muted)}.btn{border:1px solid #c6b8ac;border-radius:22px;background:#fff;color:var(--ink);padding:9px 16px;min-height:42px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.danger{color:var(--red)}.link{border:0;background:none;text-align:left;color:var(--accent);text-decoration:underline;padding:0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{border:1px solid var(--line);background:#fff;border-radius:10px;padding:18px;margin-bottom:12px}.card.action{border-left:4px solid var(--taupe)}.card.urgent{border-left-color:var(--red)}.pill{font-size:11px;border-radius:14px;padding:4px 9px;background:#f0ebe5;display:inline-block}.pill.red{color:var(--red);background:#fae9e5}.pill.green{color:var(--green);background:#e8f0e7}.stat{font:30px Georgia,serif}.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.filters input{flex:1;min-width:160px}input,select,textarea{padding:10px 11px;border:1px solid #d3c8be;border-radius:7px;background:#fff;color:var(--ink);width:100%;min-height:44px}textarea{min-height:90px;resize:vertical}label{font-size:13px;display:block;margin:12px 0 5px}details{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}summary{cursor:pointer;color:var(--accent);font-size:13px}details p,details li{font-size:13px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}dialog{border:1px solid var(--line);border-radius:12px;padding:24px;color:var(--ink);width:min(700px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#29211b99}.modal-actions{position:sticky;bottom:-24px;background:white;padding:16px 0 5px;margin-top:18px}.empty{padding:35px;text-align:center;color:var(--muted)}#notice{max-width:1120px;margin:10px auto 0;padding:10px 16px;background:#edf3eb;border-radius:7px}#notice.error{background:#fae9e5;color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.metrics .card{margin:0}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #9b7655;outline-offset:3px}.history{border-left:2px solid var(--line);padding-left:12px;margin:10px 0;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.help{background:#f5f1eb;padding:12px;border-radius:7px;font-size:13px}a{color:var(--accent)}@media(max-width:600px){header{padding:12px 16px}.wordmark{font-size:29px}.sub{font-size:9px}header select{min-width:125px;max-width:155px}main{padding-top:18px}.cols{grid-template-columns:1fr}.metrics{gap:7px}.metrics .card{padding:12px 8px}.metrics small{font-size:10px}.stat{font-size:26px}h1{font-size:28px}.card{padding:15px}.toolbar .btn{font-size:13px}.grid{grid-template-columns:1fr}.modal-actions .btn{padding:8px 12px}}
</style></head><body><header><div><div class="wordmark">DWYER</div><div class="sub">FLEET &amp; FACILITIES</div></div><select id="nav" aria-label="Main section"><option value="today">Today</option><option value="assets">Assets</option><option value="people">People</option><option value="work">Work</option><option value="reports">Reports &amp; Settings</option></select></header><div class="demo">INDEPENDENT DEMO · Fictional records · Saved in this browser only · No Firebase connection</div><div id="notice" role="status" hidden></div><main><div class="toolbar"><div><h1 id="title"></h1><small id="subtitle"></small></div><div id="actions" class="row"></div></div><div id="filters"></div><div id="view"></div></main><dialog id="modal"><div id="modalBody"></div></dialog><script>
'use strict';
const KEY='dwyer_workflow_demo_v3';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID?crypto.randomUUID():'r'+Date.now()+Math.random().toString(36).slice(2);const day=(n=0)=>{let d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const money=v=>Number(v||0).toLocaleString('en-US',{style:'currency',currency:'USD'});const btn=(label,action,data='',primary=false)=>`<button class="btn ${primary?'primary':''}" data-action="${action}" data-id="${esc(data)}">${esc(label)}</button>`;const pill=(text,cls='')=>`<span class="pill ${cls}">${esc(text)}</span>`;
let page='today',query='',filter='All',dirty=false,focusBack=null;
function seed(){return{version:3,assets:[{id:'a1',name:'Truck 101',kind:'Truck',location:'Farmington Hills',status:'Available',miles:48200,hours:'',vin:'DEMO-101',inspectionDue:day(12),axles:3,weight:33000,combination:'',states:'MI, OH (sample)',ifta:'Needs review',registration:'Needs review',notes:'Fictional truck. Confirm actual fleet specifications.'},{id:'a2',name:'Forklift 02',kind:'Forklift',location:'Warehouse',status:'Out of service',miles:'',hours:1240,inspectionDue:day(25),ifta:'Not applicable — reviewed',registration:'Not applicable — reviewed',notes:'Fictional equipment; hydraulic repair pending.'}],people:[{id:'p1',name:'Alex Sample',role:'Driver',phone:'555-0101',medicalDue:day(18),cdlDue:day(180),mvrDue:day(40),queryDue:day(90),notes:'Fictional driver; document review remains manual.'},{id:'p2',name:'Jordan Example',role:'Driver',medicalDue:day(60),mvrDue:day(-3),notes:'Fictional review task.'}],vendors:[{id:'v1',name:'Example Fleet Service',phone:'555-0120',trade:'Vehicle repairs'},{id:'v2',name:'Example Lift Service',phone:'555-0130',trade:'Material handling'}],work:[{id:'w1',name:'Hydraulic leak',asset:'a2',location:'Warehouse',category:'Repair',priority:'Urgent',status:'In progress',due:day(),vendor:'v2',estimate:450,cost:'',notes:'Sample issue: inspect hydraulic hose. Do not use until reviewed.',history:[{at:new Date().toISOString(),text:'Sample repair started.'}]},{id:'w2',name:'Preventive service',asset:'a1',location:'Farmington Hills',category:'Preventive maintenance',priority:'Routine',status:'Scheduled',due:day(7),dueMiles:50000,vendor:'v1',estimate:350,cost:'',notes:'Confirm service scope with manufacturer guidance.',history:[]}],tests:[],hos:[],fuel:[],profile:{type:'Interstate private carrier — own goods',international:'No',dot:'',mc:'',notes:'Independent operational demonstration; not an official company system.'}};}
let S;try{const raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):seed();if(!S||S.version!==3||!['assets','people','vendors','work','tests','hos','fuel'].every(k=>Array.isArray(S[k])))throw Error('Unsupported stored format');}catch(e){S=seed();setTimeout(()=>notice('Could not load saved demo data. Sample data is shown; export before making changes if you need recovery. '+e.message,true),0);}
function notice(msg,error=false){$('notice').hidden=false;$('notice').textContent=msg;$('notice').className=error?'error':'';}
function commit(next){try{localStorage.setItem(KEY,JSON.stringify(next));S=next;notice('Demo changes saved in this browser.');return true;}catch(e){notice('Save failed. Your last saved records were not changed. Export a backup or free browser storage. '+e.message,true);return false;}}
const copy=()=>JSON.parse(JSON.stringify(S));const asset=k=>S.assets.find(a=>a.id===k);const person=k=>S.people.find(a=>a.id===k);const vendor=k=>S.vendors.find(a=>a.id===k);const match=r=>JSON.stringify(r).toLowerCase().includes(query.toLowerCase());
function go(p){page=p;query='';filter='All';$('nav').value=p;render();}
function filterUI(options){$('filters').innerHTML=`<div class="filters"><input id="search" placeholder="Search ${esc(page)}…" aria-label="Search" value="${esc(query)}"><select id="filter" aria-label="Filter" style="width:auto">${options.map(o=>`<option ${o===filter?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;$('search').oninput=e=>{query=e.target.value;renderView();};$('filter').onchange=e=>{filter=e.target.value;renderView();};}
function render(){const titles={today:['Today','Start with what needs attention.'],assets:['Assets','Equipment, availability and connected work.'],people:['People','Driver records and upcoming reviews.'],work:['Work','Report → assign → resolve → retain history.'],reports:['Reports & Settings','Periodic review—not the daily work queue.']};$('title').textContent=titles[page][0];$('subtitle').textContent=titles[page][1];$('filters').innerHTML='';$('actions').innerHTML=page==='today'?btn('Report issue','newIssue','',true):page==='assets'?btn('Add asset','newAsset','',true):page==='people'?btn('Add person','newPerson','',true):page==='work'?btn('Add work','newWork','',true):btn('Export backup','export');if(page==='assets')filterUI(['All','Available','In service','Out of service','Retired']);if(page==='people')filterUI(['All','Due within 30 days']);if(page==='work')filterUI(['All','Open','Scheduled','Assigned','In progress','Completed','Overdue']);renderView();}
function alerts(){const a=[];for(const w of S.work){if(w.status==='Completed')continue;const meter=w.dueMiles!==''&&w.dueMiles!=null&&Number(asset(w.asset)?.miles||0)>=Number(w.dueMiles);if((w.due&&w.due<=day(7))||meter)a.push({title:w.name,detail:`${asset(w.asset)?.name||w.location||'Facility task'} · ${meter?'Mileage due':w.due||'No date'}`,urgent:meter||w.due<day(),action:'openWork',id:w.id});}for(const r of S.assets){if(r.status==='Out of service')a.push({title:r.name+' unavailable',detail:r.location||'Review asset readiness',urgent:true,action:'openAsset',id:r.id});if(r.inspectionDue&&r.inspectionDue<=day(30))a.push({title:r.name+' inspection',detail:'Due '+r.inspectionDue,urgent:r.inspectionDue<day(),action:'openAsset',id:r.id});}for(const p of S.people)for(const [key,label] of [['medicalDue','Medical review'],['cdlDue','CDL expiration'],['mvrDue','MVR review'],['queryDue','Clearinghouse query']])if(p[key]&&p[key]<=day(30))a.push({title:p.name+' · '+label,detail:'Due '+p[key],urgent:p[key]<day(),action:'openPerson',id:p.id});return a.sort((x,y)=>Number(y.urgent)-Number(x.urgent));}
function renderView(){if(page==='today'){const a=alerts();$('view').innerHTML=`<div class="metrics">${[['Needs attention',a.length],['Unavailable assets',S.assets.filter(a=>a.status==='Out of service').length],['Open work',S.work.filter(w=>w.status!=='Completed').length]].map(([l,n])=>`<div class="card"><small>${l}</small><div class="stat">${n}</div></div>`).join('')}</div><div class="row" style="margin-bottom:22px">${btn('Schedule service','newService')}${btn('Add asset','newAsset')}</div><h2>Next actions</h2>${a.map(r=>`<article class="card action ${r.urgent?'urgent':''}"><div class="row spread"><div><h3>${esc(r.title)}</h3><small>${esc(r.detail)}</small></div>${btn('Review',r.action,r.id)}</div></article>`).join('')||'<div class="card">No tracked actions due. This is not a compliance clearance.</div>'}`;}
if(page==='assets'){$('view').innerHTML=`<div class="grid">${S.assets.filter(match).filter(a=>filter==='All'||a.status===filter).map(a=>`<article class="card"><div class="row spread"><h3>${esc(a.name)}</h3>${pill(a.status,a.status==='Out of service'?'red':'')}</div><small>${esc(a.kind)} · ${esc(a.location)}</small><p>${esc(S.work.filter(w=>w.asset===a.id&&w.status!=='Completed').length)} open work items</p><div class="row">${btn('Open asset','openAsset',a.id)}${btn('Report issue','issueAsset',a.id)}</div></article>`).join('')||'<div class="empty">No matching assets.</div>'}</div>`;}
if(page==='people'){$('view').innerHTML=`<div class="grid">${S.people.filter(match).filter(p=>filter==='All'||['medicalDue','cdlDue','mvrDue','queryDue'].some(k=>p[k]&&p[k]<=day(30))).map(p=>`<article class="card"><h3>${esc(p.name)}</h3><small>${esc(p.role||'Driver')}</small><p>Medical: ${esc(p.medicalDue||'Not recorded')}<br>MVR review: ${esc(p.mvrDue||'Not recorded')}</p>${btn('Open person','openPerson',p.id)}</article>`).join('')||'<div class="empty">No matching people.</div>'}</div>`;}
if(page==='work'){$('view').innerHTML=S.work.filter(match).filter(w=>filter==='All'||filter==='Overdue'&&w.status!=='Completed'&&w.due&&w.due<day()||w.status===filter).sort((a,b)=>Number(a.status==='Completed')-Number(b.status==='Completed')).map(w=>`<article class="card action"><div class="row spread"><div><h3>${esc(w.name)}</h3><small>${esc(asset(w.asset)?.name||w.location||'Facility task')} · ${esc(w.category)} · Due ${esc(w.due||'not set')}</small></div>${pill(w.status,w.status==='Completed'?'green':'')}</div><div class="row spread" style="margin-top:12px"><small>${esc(vendor(w.vendor)?.name||'Vendor unassigned')}</small>${btn(w.status==='Completed'?'View history':'Continue','openWork',w.id)}</div></article>`).join('')||'<div class="empty">No matching work.</div>';}
if(page==='reports')renderReports();}
function field(key,label,value='',type='text',options=null){return `<div class="${type==='textarea'?'full':''}"><label for="f-${key}">${esc(label)}</label>${options?`<select id="f-${key}" name="${key}">${options.map(o=>{const v=typeof o==='string'?o:o[0],l=typeof o==='string'?o:o[1];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`;}).join('')}</select>`:type==='textarea'?`<textarea id="f-${key}" name="${key}">${esc(value)}</textarea>`:`<input id="f-${key}" name="${key}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="any"':''}>`}</div>`;}
function modal(content,form=false,onSubmit=null){focusBack=document.activeElement;$('modalBody').innerHTML=content;dirty=false;if(!$('modal').open)$('modal').showModal();$('modalBody').oninput=()=>{dirty=true;};if(form){$('editForm').onsubmit=e=>{e.preventDefault();onSubmit(Object.fromEntries(new FormData(e.target)));};}setTimeout(()=>$('modalBody').querySelector('input,select,button')?.focus(),0);}
function close(force=false){if(!force&&dirty&&!confirm('Discard unsaved changes?'))return false;$('modal').close();dirty=false;focusBack?.focus?.();return true;}
const foot=(save='Save')=>`<div class="row modal-actions"><button class="btn primary" type="submit">${save}</button><button class="btn" type="button" data-action="close">Cancel</button></div>`;
function editAsset(key=''){const a=asset(key)||{};modal(`<h2>${key?'Edit':'Add'} asset</h2><form id="editForm"><div class="cols">${field('name','Asset name',a.name)}${field('kind','Type',a.kind||'Truck','text',['Truck','Trailer','Forklift','Crane','Building system','Other'])}${field('location','Location',a.location)}${field('status','Availability',a.status||'Available','text',['Available','In service','Out of service','Retired'])}${field('miles','Odometer miles',a.miles,'number')}${field('hours','Operating hours',a.hours,'number')}${field('inspectionDue','Next inspection',a.inspectionDue,'date')}</div><details><summary>Registration & compliance details</summary><div class="cols">${field('vin','VIN / serial',a.vin)}${field('states','Operating states',a.states)}${field('axles','Axles',a.axles,'number')}${field('weight','Registered gross weight (lb)',a.weight,'number')}${field('combination','Combination weight (lb)',a.combination,'number')}${field('ifta','IFTA review',a.ifta||'Needs review','text',['Needs review','Applicable — reviewed','Not applicable — reviewed'])}${field('registration','Registration review',a.registration||'Needs review','text',['Needs review','Applicable — reviewed','Not applicable — reviewed'])}</div><p>Weights and routes support review; the app does not determine legal applicability.</p></details>${field('notes','Notes',a.notes,'textarea')}${foot()}</form>`,true,d=>{if(!d.name.trim()){notice('Enter an asset name.',true);return;}const n=copy();const r={...a,...d,id:key||id()};const i=n.assets.findIndex(a=>a.id===key);if(i<0)n.assets.push(r);else n.assets[i]=r;if(commit(n)){close(true);render();}});}
function openAsset(key){const a=asset(key);if(!a)return;const work=S.work.filter(w=>w.asset===key);modal(`<div class="row spread"><h2>${esc(a.name)}</h2>${btn('Close','close')}</div>${pill(a.status,a.status==='Out of service'?'red':'')}<p>${esc(a.kind)} · ${esc(a.location)}</p><div class="row">${btn('Report issue','issueAsset',key,true)}${btn('Schedule service','serviceAsset',key)}${btn('Edit asset','editAsset',key)}</div><div class="tabs"><small>Miles: ${esc(a.miles||'—')} · Hours: ${esc(a.hours||'—')} · Inspection: ${esc(a.inspectionDue||'Not recorded')}</small></div><h3>Open work</h3>${work.filter(w=>w.status!=='Completed').map(w=>`<div class="card row spread"><div>${esc(w.name)}<br><small>${esc(w.status)} · ${esc(w.due||'No due date')}</small></div>${btn('Continue','openWork',w.id)}</div>`).join('')||'<p class="muted">No open work.</p>'}<details><summary>Completed work & costs</summary>${work.filter(w=>w.status==='Completed').map(w=>`<p>${esc(w.name)} · ${money(w.cost)} ${btn('History','openWork',w.id)}</p>`).join('')||'<p>No completed work.</p>'}<p>Total recorded repair/service costs: ${money(work.reduce((s,w)=>s+Number(w.cost||0),0))}</p></details><details><summary>Fuel & compliance details</summary><p>VIN/serial: ${esc(a.vin||'Not recorded')}<br>States: ${esc(a.states||'Not recorded')}<br>Axles: ${esc(a.axles||'—')} · Registered weight: ${esc(a.weight||'—')} lb<br>IFTA: ${esc(a.ifta||'Needs review')}<br>Registration: ${esc(a.registration||'Needs review')}</p><p>Recorded fuel spend: ${money(S.fuel.filter(r=>r.asset===key).reduce((s,r)=>s+Number(r.cost||0),0))}</p>${btn('Record fuel','fuelAsset',key)}</details><details><summary>Notes</summary><p>${esc(a.notes||'No notes.')}</p></details>`);}
function editWork(key='',assetId='',category='Repair'){const w=S.work.find(w=>w.id===key)||{};const a=asset(w.asset||assetId);modal(`<h2>${key?'Continue work':category==='Repair'?'Report an issue':'Schedule work'}</h2><form id="editForm"><div class="cols">${field('asset','Asset',w.asset||assetId,'text',[['','Facility / unassigned'],...S.assets.map(a=>[a.id,a.name])])}${field('name','What needs doing?',w.name)}${field('priority','Priority',w.priority||'Routine','text',['Routine','Urgent','Safety critical'])}${field('due','Target date',w.due||day(),'date')}${field('availability','Asset availability',a?.status||'Unchanged','text',['Unchanged','Available','In service','Out of service'])}${field('category','Work type',w.category||category,'text',['Repair','Preventive maintenance','Inspection','Facility task'])}</div><details ${key?'open':''}><summary>Assignment, status & costs</summary><div class="cols">${field('status','Work status',w.status||'Open','text',['Open','Scheduled','Assigned','In progress','Completed'])}${field('vendor','Vendor',w.vendor||'','text',[['','Unassigned'],...S.vendors.map(v=>[v.id,v.name])])}${field('location','Location',w.location||a?.location)}${field('dueMiles','Due at miles',w.dueMiles,'number')}${field('estimate','Estimate $',w.estimate,'number')}${field('cost','Actual cost $',w.cost,'number')}</div></details>${field('notes','Issue / work notes',w.notes,'textarea')}<details><summary>What to record at completion</summary><p>Record what was done, actual cost, and the asset readiness decision. Completing a work item does not automatically make the asset safe to use. Choose availability explicitly.</p></details>${foot(key?'Save progress':'Create work item')}</form>`,true,d=>{if(!d.name.trim()){notice('Describe the issue or task.',true);return;}if(d.status==='Completed'&&!d.notes.trim()){notice('Add completion notes before closing the work.',true);return;}if(d.asset&&d.availability==='Available'&&d.status==='Completed'&&S.work.some(x=>x.id!==key&&x.asset===d.asset&&x.priority==='Safety critical'&&x.status!=='Completed')){notice('Another safety-critical work item remains open. Review it before returning the asset to Available.',true);return;}const n=copy();const availability=d.availability;delete d.availability;const r={...w,...d,id:key||id(),history:[...(w.history||[]),{at:new Date().toISOString(),text:key?`Saved progress: ${d.status}; notes: ${d.notes||'none'}; cost: ${d.cost||'not recorded'}`:'Work item created.'}]};const i=n.work.findIndex(x=>x.id===key);if(i<0)n.work.push(r);else n.work[i]=r;if(d.asset&&availability!=='Unchanged'){const aa=n.assets.find(a=>a.id===d.asset);if(aa)aa.status=availability;}if(commit(n)){close(true);render();}});}
function openWork(key){const w=S.work.find(w=>w.id===key);if(!w)return;modal(`<div class="row spread"><h2>${esc(w.name)}</h2>${btn('Close','close')}</div>${pill(w.status,w.status==='Completed'?'green':'')}<p>${esc(asset(w.asset)?.name||w.location||'Facility task')} · ${esc(w.category)}</p><p>Due: ${esc(w.due||'Not scheduled')}<br>Vendor: ${esc(vendor(w.vendor)?.name||'Unassigned')}<br>Estimate: ${money(w.estimate)} · Actual: ${money(w.cost)}</p><p>${esc(w.notes)}</p><div class="row">${btn(w.status==='Completed'?'Edit record':'Continue work','editWork',key,true)}${w.asset?btn('Open asset','openAsset',w.asset):''}</div><details open><summary>Record history</summary>${(w.history||[]).slice().reverse().map(h=>`<div class="history"><small>${esc(new Date(h.at).toLocaleString())}</small><br>${esc(h.text)}</div>`).join('')||'<p>No history yet.</p>'}<small>Local editable demo history—not an immutable audit trail.</small></details>`);}
function editPerson(key=''){const p=person(key)||{};modal(`<h2>${key?'Edit':'Add'} person</h2><form id="editForm"><div class="cols">${field('name','Name',p.name)}${field('role','Role',p.role||'Driver')}${field('phone','Phone',p.phone)}${field('medicalDue','Medical review due',p.medicalDue,'date')}${field('cdlDue','CDL expiration',p.cdlDue,'date')}${field('mvrDue','MVR review due',p.mvrDue,'date')}${field('queryDue','Clearinghouse query due',p.queryDue,'date')}</div>${field('notes','Verification notes',p.notes,'textarea')}${foot()}</form>`,true,d=>{if(!d.name.trim())return notice('Enter a name.',true);const n=copy(),r={...p,...d,id:key||id()},i=n.people.findIndex(p=>p.id===key);if(i<0)n.people.push(r);else n.people[i]=r;if(commit(n)){close(true);render();}});}
function openPerson(key){const p=person(key);if(!p)return;modal(`<div class="row spread"><h2>${esc(p.name)}</h2>${btn('Close','close')}</div><p>${esc(p.role)} · ${esc(p.phone||'No phone')}</p><div class="row">${btn('Update record','editPerson',key,true)}${btn('Log test','testPerson',key)}${btn('Review shift','hosPerson',key)}</div><div class="card" style="margin-top:18px">${[['Medical review','medicalDue'],['CDL expiration','cdlDue'],['MVR review','mvrDue'],['Clearinghouse query','queryDue']].map(([l,k])=>`<p>${l}: ${esc(p[k]||'Not recorded')} ${p[k]&&p[k]<day()?pill('Overdue','red'):''}</p>`).join('')}</div><details><summary>Test & shift history</summary>${S.tests.filter(t=>t.person===key).map(t=>`<p>${esc(t.date)} · ${esc(t.category)} · ${esc(t.substance)} · ${esc(t.result)}</p>`).join('')||'<p>No test entries.</p>'}${S.hos.filter(h=>h.person===key).map(h=>`<p>${esc(h.date)} · ${esc(h.review)} · ${esc(h.location)}</p>`).join('')||'<p>No shift reviews.</p>'}</details><details><summary>Relevant requirements & notes</summary><p>Records support manual review. A date or logged test does not establish driver qualification or eligibility. DOT test coverage and HOS exceptions require review of actual duties and vehicles.</p><p>${esc(p.notes)}</p></details>`);}
function logRecord(kind,personId='',assetId=''){let title,fields,help;if(kind==='test'){title='Log test';fields=field('person','Person',personId,'text',S.people.map(p=>[p.id,p.name]))+field('date','Date',day(),'date')+field('category','Test category','Random','text',['Random','Pre-employment','Post-accident','Reasonable suspicion','Return-to-duty','Follow-up'])+field('substance','Substance','Drug','text',['Drug','Alcohol','Both'])+field('result','Result','Pending','text',['Pending','Negative','Positive','Cancelled']);help='Log only. No random-testing compliance percentage is inferred. Do not store actual medical or test documents in this demo.';}
if(kind==='hos'){title='Review a shift';fields=field('person','Driver',personId,'text',S.people.map(p=>[p.id,p.name]))+field('date','Work date',day(),'date')+field('location','Normal reporting location')+field('start','Start','', 'datetime-local')+field('end','Release','', 'datetime-local')+field('radius','Maximum radius (air miles)','','number')+field('returned','Returned to reporting location','Needs review','text',['Needs review','Yes','No'])+field('review','Short-haul review','Needs review','text',['Needs review','Eligible — reviewed','Not eligible — reviewed']);help='Short-haul review prompts include a 150-air-mile radius, return to normal reporting location and release within 14 hours. Other conditions and HOS limits still apply. State borders alone do not decide eligibility; this is not an ELD.';}
if(kind==='fuel'){title='Record fuel / mileage';fields=field('asset','Asset',assetId,'text',S.assets.map(a=>[a.id,a.name]))+field('date','Date',day(),'date')+field('state','Jurisdiction')+field('fuelType','Fuel type','Diesel','text',['Diesel','Gasoline','Other'])+field('gallons','Purchased gallons','','number')+field('miles','Jurisdiction miles','','number')+field('cost','Cost $','','number')+field('reference','Receipt / trip reference');help='Fuel worksheet only. No IFTA tax calculation, filing, receipt storage or reconciliation. Use consistent trip/receipt references to avoid duplicate mileage entries.';}
modal(`<h2>${title}</h2><form id="editForm"><div class="cols">${fields}</div>${field('notes','Notes','','textarea')}<details><summary>Guidance</summary><p>${help}</p></details>${foot('Save entry')}</form>`,true,d=>{if(kind==='hos'){const h=(new Date(d.end)-new Date(d.start))/3600000;if(d.start&&d.end&&(!Number.isFinite(h)||h<0))return notice('Check shift start and end.',true);if(d.review==='Eligible — reviewed'&&(!d.location.trim()||!d.start||!d.end||h>14||d.radius===''||Number(d.radius)>150||d.returned!=='Yes'))return notice('Entered data does not support an eligible review. Confirm location, times, radius and return.',true);}if(kind==='fuel'&&(!d.asset||!d.date||!d.state.trim()))return notice('Enter asset, date and jurisdiction.',true);if(kind!=='fuel'&&!d.person)return notice('Select a person first.',true);const n=copy();n[kind==='test'?'tests':kind==='hos'?'hos':'fuel'].push({...d,id:id(),createdAt:new Date().toISOString()});if(commit(n)){close(true);render();}});}
function renderReports(){const completed=S.work.filter(w=>w.status==='Completed');$('view').innerHTML=`<div class="grid"><div class="card"><h2>Costs</h2><p>Recorded completed work: ${money(completed.reduce((s,w)=>s+Number(w.cost||0),0))}<br>Recorded fuel: ${money(S.fuel.reduce((s,f)=>s+Number(f.cost||0),0))}</p><small>Recorded amounts only; no tax or accounting calculation.</small></div><div class="card"><h2>Carrier profile</h2><p>${esc(S.profile.type)}<br>International operations: ${esc(S.profile.international)}</p>${btn('Edit profile','profile')}</div></div><div class="card"><div class="row spread"><h2>Fuel & mileage</h2>${btn('Add fuel entry','newFuel')}</div><details><summary>View worksheet & IFTA guidance</summary><p>Keep fuel and jurisdiction mileage records for vehicles subject to the applicable requirements. Private/own-goods operations and U.S.-only travel do not by themselves eliminate IFTA applicability. Confirm vehicles and arrangements separately.</p>${S.fuel.map(f=>`<p>${esc(f.date)} · ${esc(asset(f.asset)?.name)} · ${esc(f.state)} · ${esc(f.gallons||0)} gal · ${esc(f.miles||0)} mi · ${money(f.cost)}</p>`).join('')||'<p>No entries.</p>'}</details></div><div class="card"><div class="row spread"><h2>Vendors</h2>${btn('Add vendor','newVendor')}</div>${S.vendors.map(v=>`<p>${esc(v.name)} · ${esc(v.trade||'')} · ${esc(v.phone||'')} ${btn('Edit','editVendor',v.id)}</p>`).join('')}</div><div class="card"><h2>Data & demo controls</h2><div class="row">${btn('Export JSON backup','export')}${btn('Reset sample data','reset')}</div><details><summary>Scope, privacy & limitations</summary><p>This independent demo stores data only in this browser under ${KEY}. It does not connect to Firebase, migrate older demos, authenticate users or store attachments. Do not enter real employee or confidential company information.</p><p>Export includes all current demo records, not external files. No restore interface is supplied. Local history is editable, not immutable. No automatic recurring service, alert delivery, ELD synchronization, legal compliance determination or tax filing. No CSA integration.</p></details></div>`;}
function editProfile(){const p=S.profile;modal(`<h2>Carrier profile</h2><p>Private carrier · own goods · interstate U.S. operations.</p><form id="editForm"><div class="cols">${field('dot','USDOT number',p.dot)}${field('mc','MC number (optional)',p.mc)}</div>${field('notes','Notes',p.notes,'textarea')}<details><summary>Why MC is optional</summary><p>Do not treat missing for-hire authority as an incomplete requirement merely because this private fleet crosses state lines. Review actual operations and applicable safety requirements separately.</p></details>${foot()}</form>`,true,d=>{const n=copy();n.profile={...n.profile,...d};if(commit(n)){close(true);render();}});}
function editVendor(key=''){const v=vendor(key)||{};modal(`<h2>${key?'Edit':'Add'} vendor</h2><form id="editForm">${field('name','Vendor name',v.name)}${field('phone','Phone',v.phone)}${field('trade','Service type',v.trade)}${foot()}</form>`,true,d=>{if(!d.name.trim())return notice('Enter a vendor name.',true);const n=copy(),r={...d,id:key||id()},i=n.vendors.findIndex(x=>x.id===key);if(i<0)n.vendors.push(r);else n.vendors[i]=r;if(commit(n)){close(true);render();}});}
function exportData(){const u=URL.createObjectURL(new Blob([JSON.stringify({exportedAt:new Date().toISOString(),demo:true,state:S},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='dwyer-workflow-demo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);}
function act(action,key){const replacing=['openAsset','openPerson','openWork','editAsset','editPerson','editWork','issueAsset','serviceAsset','fuelAsset','testPerson','hosPerson','newVendor','editVendor','profile'];if($('modal').open&&dirty&&replacing.includes(action)&&!confirm('Discard unsaved changes and open another record?'))return;
 switch(action){case 'close':close();break;case 'newIssue':editWork();break;case 'newWork':editWork('','','Facility task');break;case 'newService':editWork('','','Preventive maintenance');break;case 'newAsset':editAsset();break;case 'editAsset':editAsset(key);break;case 'openAsset':openAsset(key);break;case 'issueAsset':editWork('',key);break;case 'serviceAsset':editWork('',key,'Preventive maintenance');break;case 'openWork':openWork(key);break;case 'editWork':editWork(key);break;case 'newPerson':editPerson();break;case 'editPerson':editPerson(key);break;case 'openPerson':openPerson(key);break;case 'testPerson':logRecord('test',key);break;case 'hosPerson':logRecord('hos',key);break;case 'fuelAsset':logRecord('fuel','',key);break;case 'newFuel':logRecord('fuel');break;case 'newVendor':editVendor();break;case 'editVendor':editVendor(key);break;case 'profile':editProfile();break;case 'export':exportData();break;case 'reset':if(confirm('Discard all workflow-demo records and restore fictional samples?')){if(commit(seed()))render();}break;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.action,b.dataset.id||'');});$('nav').onchange=e=>go(e.target.value);$('modal').addEventListener('cancel',e=>{e.preventDefault();close();});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});render();
</script></body></html>
