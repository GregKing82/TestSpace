<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="claude:viewport-fit-sides" content="cover">
<title>Fleet Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg:    #0e0d0b;
  --bg2:   #161512;
  --bg3:   #1e1c19;
  --bg4:   #252320;
  --fg:    #f0ece4;
  --fg2:   #a89f90;
  --fg3:   #6b6358;
  --border: #2c2a26;
  --border2: #3a3832;
  --accent: #c4a567;
  --accent2: #a8894e;
  --ok:    #7dbd8a;
  --ok-bg: #0d2314;
  --warn:  #d4a843;
  --warn-bg: #1f1600;
  --danger: #d46b6b;
  --danger-bg: #200a0a;
  --sidebar-w: 210px;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 13.5px;
  display: flex; flex-direction: column;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}

.app { display: flex; flex: 1; overflow: hidden; }

.sidebar {
  width: var(--sidebar-w); background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
  overflow-y: auto;
}
.sidebar-logo { padding: 20px 16px 16px; border-bottom: 1px solid var(--border); }
.sidebar-logo .co { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; letter-spacing: .04em; color: var(--accent); line-height: 1.2; }
.sidebar-logo .app-name { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; color: var(--fg3); margin-top: 5px; }
.nav-section { padding: 10px 0 6px; }
.nav-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--fg3); padding: 0 16px; margin-bottom: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 16px; font-size: 12.5px; font-weight: 400;
  color: var(--fg2); cursor: pointer;
  border: none; background: none; width: 100%; text-align: left;
  transition: background .12s, color .12s;
  letter-spacing: .01em; border-right: 2px solid transparent;
}
.nav-item:hover { background: var(--bg3); color: var(--fg); }
.nav-item.active { background: var(--bg3); color: var(--accent); font-weight: 500; border-right-color: var(--accent); }
.nav-icon { font-size: 14px; width: 18px; flex-shrink: 0; opacity: .7; }
.badge { margin-left: auto; font-size: 10px; font-weight: 600; background: var(--danger); color: #fff; border-radius: 10px; padding: 1px 5px; }

.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px; border-bottom: 1px solid var(--border);
  background: var(--bg2); position: sticky; top: 0; z-index: 5;
  flex-shrink: 0;
}
.topbar h1 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; letter-spacing: .02em; }
.topbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.content { padding: 28px; flex: 1; }

.btn { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: .04em; padding: 7px 16px; border-radius: 4px; border: 1px solid var(--border2); background: var(--bg3); color: var(--fg2); cursor: pointer; transition: background .12s, color .12s; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.btn:hover { background: var(--bg4); color: var(--fg); }
.btn-primary { background: var(--accent); color: #0e0d0b; border-color: var(--accent); font-weight: 600; }
.btn-primary:hover { background: var(--accent2); border-color: var(--accent2); color: #0e0d0b; }
.btn-sm { padding: 4px 11px; font-size: 11px; }
.btn-danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
.btn-link { background: none; border-color: var(--accent2); color: var(--accent); }
.btn-link:hover { background: var(--bg3); color: var(--accent); }

.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; padding: 16px 18px; }
.stat-label { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .13em; color: var(--fg3); }
.stat-num { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 600; line-height: 1.05; margin-top: 5px; font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 12px; color: var(--fg2); margin-top: 3px; }
.stat-ok { color: var(--ok); }
.stat-warn { color: var(--warn); }
.stat-danger { color: var(--danger); }
.stat-gold { color: var(--accent); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { text-align: left; font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--fg3); padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--bg2); white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: none; }
tbody td { padding: 10px 14px; vertical-align: middle; }
tbody tr:hover td { background: var(--bg3); }

.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
.pill-ok { background: var(--ok-bg); color: var(--ok); }
.pill-warn { background: var(--warn-bg); color: var(--warn); }
.pill-danger { background: var(--danger-bg); color: var(--danger); }
.pill-neutral { background: var(--bg3); color: var(--fg2); }
.pill-gold { background: #1c1810; color: var(--accent); }

.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-head h2 { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; letter-spacing: .01em; }
.section-head p { font-size: 12px; color: var(--fg2); margin-top: 2px; }

.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
.card-pad { padding: 16px; }

.modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: 5px; width: 100%; max-width: 520px; padding: 28px; max-height: 90vh; overflow-y: auto; }
.modal h3 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; margin-bottom: 18px; letter-spacing: .02em; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.full { grid-column: 1/-1; }
label { font-size: 11px; font-weight: 600; color: var(--fg3); text-transform: uppercase; letter-spacing: .08em; }
input, select, textarea { font-family: 'Inter', sans-serif; font-size: 13px; padding: 7px 10px; border: 1px solid var(--border2); border-radius: 4px; background: var(--bg3); color: var(--fg); width: 100%; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
.form-section { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--fg3); grid-column: 1/-1; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--border); }

/* DQ checklist */
.checklist { display: flex; flex-direction: column; gap: 6px; }
.check-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg3); }
.check-row.done { background: var(--ok-bg); border-color: rgba(125,189,138,.25); }
.check-row.done .check-label { color: var(--ok); }
.check-box { width: 16px; height: 16px; border: 1.5px solid var(--border2); border-radius: 2px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.check-box.checked { background: var(--ok); border-color: var(--ok); }
.check-box.checked::after { content: '✓'; color: #000; font-size: 10px; font-weight: 700; }
.check-label { font-size: 13px; font-weight: 400; flex: 1; min-width: 0; }
.check-date { font-size: 11px; color: var(--fg3); white-space: nowrap; }
.photo-btn { cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg2); line-height: 1.3; flex-shrink: 0; }
.photo-btn.has-photo { border-color: var(--accent); background: #1c1810; }
.photo-thumb { width: 28px; height: 28px; object-fit: cover; border-radius: 3px; cursor: pointer; flex-shrink: 0; border: 1px solid var(--border); }

/* HOS */
.hos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.hos-box { background: var(--bg3); border: 1px solid var(--border); border-radius: 5px; padding: 16px 14px; }
.hos-num { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; color: var(--accent); line-height: 1; }
.hos-unit { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--fg3); margin-top: 2px; }
.hos-desc { font-size: 12px; color: var(--fg2); margin-top: 6px; line-height: 1.4; }

/* IFTA */
.state-list { display: flex; flex-direction: column; gap: 6px; }
.state-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg3); }
.state-row.base { border-color: rgba(196,165,103,.35); background: #1c1810; }
.state-abbr { font-size: 12px; font-weight: 600; width: 32px; flex-shrink: 0; color: var(--fg2); }
.state-field { display: flex; align-items: center; gap: 5px; flex: 1; }
.state-input { border: 1px solid var(--border2); border-radius: 4px; padding: 5px 8px; background: var(--bg2); color: var(--fg); font-size: 13px; width: 110px; font-variant-numeric: tabular-nums; }
.state-input:focus { outline: none; border-color: var(--accent); }
.state-unit { font-size: 11px; color: var(--fg3); white-space: nowrap; }
.add-state-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }

/* Receipts */
.receipt-list { display: flex; flex-direction: column; gap: 6px; }
.receipt-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg3); font-size: 12px; }
.receipt-photo { width: 26px; height: 26px; object-fit: cover; border-radius: 3px; border: 1px solid var(--border); cursor: pointer; flex-shrink: 0; }

.q-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.q-tab { padding: 6px 16px; font-size: 11px; font-weight: 500; letter-spacing: .06em; border: 1px solid var(--border2); border-radius: 3px; cursor: pointer; background: var(--bg2); color: var(--fg2); text-transform: uppercase; }
.q-tab.active { background: var(--accent); color: #0e0d0b; border-color: var(--accent); font-weight: 600; }

/* D&A */
.da-row { display: grid; grid-template-columns: 88px 80px 140px 1fr auto; gap: 10px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
.da-row:last-child { border-bottom: none; }
.da-head { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--fg3); padding: 9px 14px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 88px 80px 140px 1fr auto; gap: 10px; background: var(--bg); }

/* CSA */
.csa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.csa-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; padding: 16px; }
.csa-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--fg2); margin-bottom: 10px; }
.csa-bar-bg { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.csa-bar { height: 100%; border-radius: 3px; transition: width .3s; }

.alert-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 4px; margin-bottom: 14px; font-size: 13px; }
.alert-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(212,168,67,.3); }
.alert-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(212,107,107,.3); }
.dl-list { display: flex; flex-direction: column; gap: 6px; }
.dl-item { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
.dl-date { font-size: 12px; font-weight: 600; width: 70px; flex-shrink: 0; color: var(--fg2); }
.dl-name { flex: 1; }
.dl-days { font-size: 12px; font-weight: 600; }

.lightbox { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
.lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 5px; object-fit: contain; }

.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.settings-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; padding: 18px; }
.settings-card h3 { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; margin-bottom: 14px; color: var(--fg); }
.field-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field-row:last-child { margin-bottom: 0; }
.field-val { font-size: 13px; font-weight: 500; color: var(--fg); padding: 7px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; min-height: 34px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

.empty { text-align: center; padding: 48px 24px; color: var(--fg3); }
.empty-icon { font-size: 32px; margin-bottom: 10px; }

@media (max-width: 700px) {
  .sidebar { display: none; }
  .form-grid { grid-template-columns: 1fr; }
  .da-row, .da-head { grid-template-columns: 1fr 1fr; }
  .da-row span:nth-child(n+3), .da-head span:nth-child(n+3) { display: none; }
  .hos-grid { grid-template-columns: repeat(2,1fr); }
  .settings-grid, .two-col { grid-template-columns: 1fr; }
}

.sidebar {display:none !important;}
.section-selector {display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.section-selector select {width:220px;max-width:100%;}
.demo-banner {padding:10px 20px;background:#1f1600;color:#d4a843;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
@media(max-width:700px){.topbar{padding:12px;align-items:flex-start;gap:12px;flex-direction:column}.content{padding:14px}.section-selector select{width:100%;}.section-selector{width:100%;}}
</style></head><body>

<div id="modal-root"></div>
<input type="file" id="photo-input" accept="image/*" style="display:none" onchange="handlePhotoFile(event)">
<input type="file" id="receipt-input" accept="image/*" style="display:none" onchange="handleReceiptFile(event)">

<script>
const ALL_STATES = ['AL','AK','AR','AZ','CA','CO','CT','DE','FL','GA','IA','ID','IL','IN','KS','KY','LA','MA','MD','ME','MN','MO','MS','MT','NC','ND','NE','NH','NJ','NM','NV','NY','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VA','VT','WA','WI','WV','WY'];

let S = {
  drivers: [], da: [], hosLog: [], csa: {},
  ifta: {}, iftaStates: { 'Q1':['MI'],'Q2':['MI'],'Q3':['MI'],'Q4-prev':['MI'] },
  receipts: {},
  activeQ: curQ(),
  co: { dot:'', mc:'', eld:'', state:'MI', name:'Dwyer Marble & Stone' }
};

let pendingPhoto = null;
let pendingReceipt = null;

function curQ() {
  const m = new Date().getMonth();
  return m<3?'Q4-prev':m<6?'Q1':m<9?'Q2':'Q3';
}
function save() { try { localStorage.setItem('fleetops_dropdown_demo_v1', JSON.stringify(S)); } catch(e){} }
function load() {
  try {
    const d = localStorage.getItem('fleetops_dropdown_demo_v1');
    if (d) { const p = JSON.parse(d); S = {...S,...p}; }
    if (!S.iftaStates) S.iftaStates = {'Q1':['MI'],'Q2':['MI'],'Q3':['MI'],'Q4-prev':['MI']};
    if (!S.co) S.co = { dot:'',mc:'',eld:'',state:'MI',name:'Dwyer Marble & Stone' };
    if (!S.hosLog) S.hosLog = [];
    if (!S.receipts) S.receipts = {};
  } catch(e) {}
}

const DQ_ITEMS = [
  { key:'app',          label:'Employment Application (10-yr history)',    photo:true },
  { key:'clearinghouse',label:'Clearinghouse Query (full)',                photo:false },
  { key:'mvr',          label:'MVR Pulled (all states, 3 yrs)',            hasDate:true,   photo:false },
  { key:'med',          label:'Medical Certificate',                       hasExpiry:true, photo:true },
  { key:'road',         label:'Road Test Certificate / CDL Copy',          photo:true },
  { key:'prev_emp',     label:'Prior Employer Verification (3 yrs)',       photo:false },
  { key:'drug',         label:'Pre-Employment Drug Test (negative)',       photo:true },
];

const CSA_CATS = [
  { key:'unsafe',  label:'Unsafe Driving',                threshold:65 },
  { key:'hos',     label:'HOS Compliance',                threshold:65 },
  { key:'fitness', label:'Driver Fitness',                threshold:80 },
  { key:'da',      label:'Controlled Substances/Alcohol', threshold:80 },
  { key:'maint',   label:'Vehicle Maintenance',           threshold:80 },
  { key:'hazmat',  label:'Hazardous Materials',           threshold:80 },
  { key:'crash',   label:'Crash Indicator',               threshold:65 },
];

const HOS_RULES = [
  { num:'11',    unit:'hrs driving',  desc:'Max driving time after 10 consecutive hrs off duty' },
  { num:'14',    unit:'hr window',    desc:'On-duty time limit from the moment the shift starts' },
  { num:'30',    unit:'min break',    desc:'Required after 8 cumulative hours of driving time' },
  { num:'10',    unit:'hrs off',      desc:'Minimum consecutive off-duty time to reset the driving window' },
  { num:'60/70', unit:'hr limit',     desc:'On-duty cap over any 7 consecutive days (60) or 8 days (70)' },
  { num:'34',    unit:'hr restart',   desc:'May restart the 7/8-day period after 34 consecutive hours off duty' },
];

const QUARTERS = ['Q1','Q2','Q3','Q4-prev'];
const Q_LABELS = { 'Q1':'Q1 (Jan–Mar)','Q2':'Q2 (Apr–Jun)','Q3':'Q3 (Jul–Sep)','Q4-prev':'Q4 Prior Year' };
const Q_DUE   = { 'Q1':'Apr 30','Q2':'Jul 31','Q3':'Oct 31','Q4-prev':'Jan 31' };

const PAGE_LINKS = {
  dashboard:  { label:'FMCSA Portal',       url:'https://portal.fmcsa.dot.gov/' },
  drivers:    { label:'Open Clearinghouse', url:'https://clearinghouse.fmcsa.dot.gov/' },
  da:         { label:'Open Clearinghouse', url:'https://clearinghouse.fmcsa.dot.gov/' },
  csa:        { label:'Open SMS',           url:'https://ai.fmcsa.dot.gov/' },
  hos:        { label:'FMCSA HOS Rules',    url:'https://www.fmcsa.dot.gov/regulations/hours-service/summary-hours-service-regulations' },
  ifta:       { label:'File with Michigan', url:'https://mto.treasury.michigan.gov/' },
  deadlines:  { label:'FMCSA Calendar',     url:'https://www.fmcsa.dot.gov/registration/commercial-drivers-license' },
  settings:   { label:'SAFER Web',          url:'https://safer.fmcsa.dot.gov/' },
};

function dq_pct(d) {
  return Math.round(DQ_ITEMS.filter(i=>d.dq?.[i.key]?.done).length / DQ_ITEMS.length * 100);
}
function dq_status(d) {
  const p = dq_pct(d);
  if (p===100) {
    if (d.dq?.med?.expiry) {
      const dy = Math.ceil((new Date(d.dq.med.expiry)-new Date())/86400000);
      if (dy<0) return {label:'Med Expired',cls:'pill-danger'};
      if (dy<30) return {label:'Med Expiring',cls:'pill-warn'};
    }
    if (d.dq?.mvr?.date) {
      const dy = Math.ceil((new Date()-new Date(d.dq.mvr.date))/86400000);
      if (dy>365) return {label:'MVR Overdue',cls:'pill-danger'};
      if (dy>335) return {label:'MVR Due Soon',cls:'pill-warn'};
    }
    return {label:'Complete',cls:'pill-ok'};
  }
  if (p===0) return {label:'Not Started',cls:'pill-neutral'};
  return {label:`${p}% Complete`,cls:'pill-warn'};
}
function days_until(ds) { return ds ? Math.ceil((new Date(ds)-new Date())/86400000) : null; }
function fmt_date(s) { return s ? new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'; }
function incomplete_dq() { return S.drivers.filter(d=>dq_pct(d)<100).length; }
function expiring_soon() {
  return S.drivers.filter(d=>{
    const md = d.dq?.med?.expiry ? days_until(d.dq.med.expiry) : null;
    const mr = d.dq?.mvr?.date ? Math.ceil((new Date(new Date(d.dq.mvr.date).getTime()+365*86400000)-new Date())/86400000) : null;
    return (md!==null&&md>=0&&md<30)||(mr!==null&&mr>=0&&mr<30);
  }).length;
}
function all_deadlines() {
  const list = [];
  [['Q1','2026-04-30'],['Q2','2026-07-31'],['Q3','2026-10-31'],['Q4-prev','2027-01-31']].forEach(([q,d])=>{
    list.push({date:d,name:`IFTA ${Q_LABELS[q]} filing`,type:'ifta'});
  });
  S.drivers.forEach(drv=>{
    if (drv.dq?.med?.expiry) list.push({date:drv.dq.med.expiry,name:`${drv.name} — Medical Certificate`,type:'med'});
    if (drv.dq?.mvr?.date) {
      const due = new Date(new Date(drv.dq.mvr.date).getTime()+365*86400000);
      list.push({date:due.toISOString().slice(0,10),name:`${drv.name} — Annual MVR Review`,type:'mvr'});
    }
  });
  return list.filter(d=>days_until(d.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));
}
function total_ifta(q,field) {
  return Object.values(S.ifta[q]||{}).reduce((a,b)=>a+(Number(b[field])||0),0);
}

function handlePhotoFile(e) {
  const file=e.target.files[0]; if(!file||!pendingPhoto) return;
  compressImage(file,900,0.78,dataUrl=>{
    const drv=S.drivers.find(d=>d.id===pendingPhoto.driverId);
    if(drv){
      if(!drv.dq) drv.dq={};
      if(!drv.dq[pendingPhoto.key]) drv.dq[pendingPhoto.key]={};
      drv.dq[pendingPhoto.key].photo=dataUrl;
      drv.dq[pendingPhoto.key].done=true;
      save(); render();
    }
    pendingPhoto=null;
  });
}
function showPhoto(driverId,key) {
  const drv=S.drivers.find(d=>d.id===driverId);
  const photo=drv?.dq?.[key]?.photo; if(!photo) return;
  openLightbox(photo);

function openLightbox(src) {
  const lb=document.createElement('div');
  lb.className='lightbox';
  lb.innerHTML=`<img src="${src}">`;
  lb.onclick=()=>lb.remove();
  document.body.appendChild(lb);
}
function compressImage(file,maxPx,quality,cb) {
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>maxPx){h=Math.round(h*maxPx/w);w=maxPx;}
      if(h>maxPx){w=Math.round(w*maxPx/h);h=maxPx;}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',quality));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ─── IFTA ─────────────────────────────────────────────────────────────────────
function renderIFTA() {
  const el=document.getElementById('main-content');
  const q=S.activeQ;
  if(!S.iftaStates[q]) S.iftaStates[q]=['MI'];
  const states=S.iftaStates[q];
  const data=S.ifta[q]||{};
  const mi=total_ifta(q,'miles'), gal=total_ifta(q,'gallons');
  const mpg=gal>0?(mi/gal).toFixed(1):'—';
  const available=ALL_STATES.filter(s=>!states.includes(s));
  const qReceipts=(S.receipts[q]||[]);

  const stateRows=states.map(st=>{
    const rec=data[st]||{}, isBase=st==='MI';
    return `<div class="state-row ${isBase?'base':''}">
      <span class="state-abbr">${st}${isBase?' ★':''}</span>
      <div class="state-field">
        <input class="state-input" type="number" min="0" placeholder="0" value="${rec.miles||''}" oninput="updateIFTA('${st}','miles',this.value)" title="Miles in ${st}">
        <span class="state-unit">mi</span>
      </div>
      <div class="state-field">
        <input class="state-input" type="number" min="0" placeholder="0" value="${rec.gallons||''}" oninput="updateIFTA('${st}','gallons',this.value)" title="Gal purchased in ${st}">
        <span class="state-unit">gal</span>
      </div>
      ${isBase?`<span style="font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap">Base State</span>`:`<button class="btn btn-sm btn-danger" onclick="removeIFTAState('${st}')">✕</button>`}
    </div>`;
  }).join('');

  const receiptRows=qReceipts.map(r=>`<div class="receipt-row">
    ${r.photo?`<img class="receipt-photo" src="${r.photo}" onclick="openLightbox('${r.photo}')">`:``}
    <span style="width:80px;color:var(--fg3)">${fmt_date(r.date)}</span>
    <span style="width:32px;font-weight:600">${r.state||'—'}</span>
    <span style="flex:1">${r.location||'—'}</span>
    <span style="font-weight:600">${r.gallons?r.gallons+' gal':'—'}</span>
    <span style="color:var(--fg3);margin-left:8px">${r.amount?'$'+r.amount:''}</span>
    <button class="btn btn-sm btn-danger" onclick="deleteReceipt('${q}','${r.id}')">✕</button>
  </div>`).join('');

  el.innerHTML=`
    <div class="q-tabs">
      ${QUARTERS.map(qk=>`<div class="q-tab ${q===qk?'active':''}" onclick="switchQ('${qk}')">${qk==='Q4-prev'?'Q4 (Prev)':qk} <span style="font-size:10px;opacity:.7;margin-left:2px">Due ${Q_DUE[qk]}</span></div>`).join('')}
    </div>
    <div class="stat-row" style="margin-bottom:20px">
      <div class="stat-card"><div class="stat-label">Total Miles</div><div class="stat-num" style="font-size:26px" id="ifta-mi">${mi.toLocaleString()}</div><div class="stat-sub">${Q_LABELS[q]}</div></div>
      <div class="stat-card"><div class="stat-label">Total Gallons</div><div class="stat-num" style="font-size:26px" id="ifta-gal">${gal.toLocaleString()}</div><div class="stat-sub">purchased</div></div>
      <div class="stat-card"><div class="stat-label">Fleet MPG</div><div class="stat-num" style="font-size:26px" id="ifta-mpg">${mpg}</div><div class="stat-sub">miles per gallon</div></div>
      <div class="stat-card"><div class="stat-label">Receipts</div><div class="stat-num" style="font-size:26px">${qReceipts.length}</div><div class="stat-sub">logged this quarter</div></div>
    </div>
    <div class="two-col">
      <div>
        <div class="section-head"><div><h2>Miles & Gallons by State</h2><p>Michigan is your base jurisdiction.</p></div></div>
        <div class="card card-pad">
          <div class="state-list">${stateRows}</div>
          <div class="add-state-row">
            <select id="state-add-select" style="max-width:140px"><option value="">Add state...</option>${available.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
            <button class="btn btn-sm btn-primary" onclick="addIFTAState()">+ Add State</button>
          </div>
        </div>
      </div>
      <div>
        <div class="section-head"><div><h2>Fuel Receipts</h2><p>Date, location, gallons, cost per receipt.</p></div><button class="btn btn-sm btn-primary" onclick="openAddReceipt()">+ Add Receipt</button></div>
        <div class="card card-pad">
          ${qReceipts.length===0?`<div class="empty" style="padding:24px"><div class="empty-icon">🧾</div><p>No receipts logged for this quarter.</p></div>`:
          `<div class="receipt-list">${receiptRows}</div>`}
        </div>
      </div>
    </div>`;
}
function switchQ(q) { S.activeQ=q; save(); renderIFTA(); }
function addIFTAState() {
  const sel=document.getElementById('state-add-select'); if(!sel) return;
  const st=sel.value; if(!st) return;
  const q=S.activeQ;
  if(!S.iftaStates[q]) S.iftaStates[q]=['MI'];
  if(!S.iftaStates[q].includes(st)) S.iftaStates[q].push(st);
  save(); renderIFTA();
}
function removeIFTAState(st) {
  const q=S.activeQ;
  S.iftaStates[q]=(S.iftaStates[q]||[]).filter(s=>s!==st);
  save(); renderIFTA();
}
function updateIFTA(state,field,val) {
  if(!S.ifta[S.activeQ]) S.ifta[S.activeQ]={};
  if(!S.ifta[S.activeQ][state]) S.ifta[S.activeQ][state]={};
  S.ifta[S.activeQ][state][field]=val===''?null:Number(val);
  save();
  const mi=total_ifta(S.activeQ,'miles'), gal=total_ifta(S.activeQ,'gallons');
  const a=document.getElementById('ifta-mi'),b=document.getElementById('ifta-gal'),c=document.getElementById('ifta-mpg');
  if(a) a.textContent=mi.toLocaleString();
  if(b) b.textContent=gal.toLocaleString();
  if(c) c.textContent=gal>0?(mi/gal).toFixed(1):'—';
}
function openAddReceipt() {
  document.getElementById('modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal"><h3>Add Fuel Receipt</h3>
      <div class="form-grid">
        <div class="form-group"><label>Date</label><input id="r-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="form-group"><label>State</label>
          <select id="r-state">${(S.iftaStates[S.activeQ]||['MI']).map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
        </div>
        <div class="form-group full"><label>Location / Fuel Stop</label><input id="r-location" placeholder="Flying J — I-75 Exit 195, Flint MI"></div>
        <div class="form-group"><label>Gallons</label><input id="r-gallons" type="number" min="0" step="0.001" placeholder="0.000"></div>
        <div class="form-group"><label>Total Cost ($)</label><input id="r-amount" type="number" min="0" step="0.01" placeholder="0.00"></div>
        <div class="form-group full"><label>Receipt Photo (optional)</label>
          <button class="btn" style="width:fit-content" onclick="triggerReceiptPhoto()">📎 Attach Photo</button>
          <span id="r-photo-status" style="font-size:12px;color:var(--fg3);margin-top:4px"></span>
        </div>
      </div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveReceipt()">Save Receipt</button></div>
    </div>
  </div>`;
}
function triggerReceiptPhoto() {
  pendingReceipt='pending'; pendingPhoto=null;
  document.getElementById('receipt-input').value='';
  document.getElementById('receipt-input').click();
}
let pendingReceiptPhoto=null;
function handleReceiptFile(e) {
  const file=e.target.files[0]; if(!file) return;
  compressImage(file,1200,0.80,dataUrl=>{
    pendingReceiptPhoto=dataUrl;
    const st=document.getElementById('r-photo-status');
    if(st) st.textContent='Photo attached ✓';
  });
}
function saveReceipt() {
  const rec={id:'rec_'+Date.now(),date:document.getElementById('r-date').value,state:document.getElementById('r-state').value,location:document.getElementById('r-location').value,gallons:document.getElementById('r-gallons').value,amount:document.getElementById('r-amount').value,photo:pendingReceiptPhoto||null};
  if(!S.receipts[S.activeQ]) S.receipts[S.activeQ]=[];
  S.receipts[S.activeQ].push(rec);
  pendingReceiptPhoto=null; pendingReceipt=null;
  save(); closeModal(); renderIFTA();
}
function deleteReceipt(q,id) {
  if(S.receipts[q]) S.receipts[q]=S.receipts[q].filter(r=>r.id!==id);
  save(); renderIFTA();
}

// ─── Deadlines ────────────────────────────────────────────────────────────────
function renderDeadlines() {
  const el=document.getElementById('main-content');
  const list=all_deadlines();
  if(list.length===0){el.innerHTML='<div class="empty"><div class="empty-icon">📅</div><p>No upcoming deadlines. Add drivers to track document expirations.</p></div>';return;}
  const soon=list.filter(d=>days_until(d.date)<=30);
  const later=list.filter(d=>days_until(d.date)>30);
  function rg(title,items,cls){
    if(!items.length) return '';
    return `<div class="section-head"><div><h2>${title}</h2></div></div>
    <div class="card" style="margin-bottom:20px"><div class="dl-list" style="padding:14px">
      ${items.map(d=>`<div class="dl-item"><span class="dl-date">${fmt_date(d.date)}</span><span class="dl-name">${d.name}</span><span class="dl-days ${cls}">${days_until(d.date)}d</span></div>`).join('')}
    </div></div>`;
  }
  el.innerHTML=rg('Next 30 Days',soon,'stat-warn')+rg('Upcoming',later,'stat-ok');
}
